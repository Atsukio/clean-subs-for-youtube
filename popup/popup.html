<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light dark">
  <title>Everything for YouTube</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1>Everything for YouTube</h1>

  <section aria-labelledby="h-subs">
    <h2 id="h-subs">Subscriptions page</h2>
    <label class="item">
      <span class="text">Hide "Most relevant" and extra shelves</span>
      <input type="checkbox" role="switch" data-setting="hideMostRelevant">
    </label>
    <label class="item">
      <span class="text">Videos | Shorts tabs</span>
      <input type="checkbox" role="switch" data-setting="tabs">
    </label>
    <label class="item nested">
      <span class="text">Keep "All subscriptions" on the tab row</span>
      <input type="checkbox" role="switch" data-setting="allSubsInRow">
    </label>
  </section>

  <section aria-labelledby="h-w2g">
    <h2 id="h-w2g">Watch2Gether</h2>
    <label class="item">
      <span class="text">
        Add-to-W2G button on thumbnails
        <span class="support" id="w2g-hint">Turning this on asks Chrome for access to w2g.tv.</span>
      </span>
      <input type="checkbox" role="switch" data-setting="w2g">
    </label>

    <div id="w2g-config" hidden>
      <div class="field-wrap">
        <label class="field">
          <input id="apiKey" type="password" autocomplete="off" spellcheck="false" placeholder=" ">
          <span class="label">W2G API key</span>
        </label>
        <p class="support" id="apiKey-help"></p>
      </div>
      <div class="field-wrap">
        <label class="field">
          <input id="room-input" type="text" spellcheck="false" placeholder=" ">
          <span class="label">Room streamkey or URL</span>
        </label>
        <p class="support" id="room-help"></p>
      </div>

      <div class="actions">
        <button id="forget" class="text danger" type="button">Forget</button>
        <span class="spacer"></span>
        <button id="test" class="tonal" type="button">Test connection</button>
        <button id="save" class="filled" type="button">Save</button>
      </div>
    </div>
  </section>

  <p id="status" role="status"></p>
  <p class="footnote">Built for personal and friends' use. If it fits yours too, you're welcome to use it.</p>
  <script src="../lib/settings.js"></script>
  <script src="popup.js"></script>
</body>
</html>
