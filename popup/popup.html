<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Everything for YouTube</title>
  <meta name="color-scheme" content="light dark">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1>Everything for YouTube</h1>

  <section>
    <h2>Subscriptions page</h2>
    <label class="toggle"><input type="checkbox" data-setting="hideMostRelevant">
      <span>Hide "Most relevant" and extra shelves</span></label>
    <label class="toggle"><input type="checkbox" data-setting="tabs">
      <span>Videos | Shorts tabs</span></label>
    <label class="toggle sub"><input type="checkbox" data-setting="allSubsInRow">
      <span>Keep "All subscriptions" on the tab row</span></label>
  </section>

  <section>
    <h2>Watch2Gether</h2>
    <label class="toggle"><input type="checkbox" data-setting="w2g">
      <span>Add-to-W2G button on video thumbnails</span></label>
    <p class="muted" id="w2g-hint">Turning this on asks Chrome for access to w2g.tv.</p>

    <div id="w2g-config" hidden>
      <p id="room" class="room"></p>
      <label>W2G API key
        <input id="apiKey" type="password" autocomplete="off" spellcheck="false">
      </label>
      <label>Room streamkey or URL
        <input id="room-input" type="text" placeholder="https://w2g.tv/rooms/…" spellcheck="false">
      </label>
      <div class="row">
        <button id="save">Save</button>
        <button id="test" class="secondary">Test connection</button>
      </div>
      <button id="forget" class="link">Forget saved key and room</button>
    </div>
  </section>

  <p id="status" role="status"></p>
  <p class="footnote">Built for personal and friends' use. If it fits yours too, you're welcome to it.</p>
  <script src="../lib/settings.js"></script>
  <script src="popup.js"></script>
</body>
</html>
