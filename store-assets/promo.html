<!doctype html>
<!-- Source for the Web Store promo images: #small (440x280, the required small promo tile) and #marquee (1400x560, optional).
     Uses the pixel-art icon and the Material 3 tokens from ../popup/theme.css (dark scheme). No YouTube logos or artwork.
     Build with:  npm run screenshots  -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Store promo</title>
<link rel="stylesheet" href="../popup/theme.css">
<style>
  html, body { margin: 0; overflow: hidden; background: var(--md-sys-color-surface); color: var(--md-sys-color-on-surface); font-family: var(--md-ref-typeface); }
  .tile { position: relative; display: flex; box-sizing: border-box; overflow: hidden;
    background: radial-gradient(120% 140% at 0% 0%, var(--md-sys-color-primary-container) 0%, var(--md-sys-color-surface) 62%); }
  .tile::after { content: ""; position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(0deg, transparent 0 7px, rgba(255,255,255,.025) 7px 8px); }  /* faint pixel-grid texture */
  .icon { image-rendering: pixelated; flex: none; }
  h1 { margin: 0; font-weight: 700; letter-spacing: -0.01em; line-height: 1.08; }
  p { margin: 0; color: var(--md-sys-color-on-surface-variant); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { padding: 6px 14px; border-radius: 999px; background: var(--md-sys-color-secondary-container); color: var(--md-sys-color-on-secondary-container); font: 500 14px/20px var(--md-ref-typeface); }

  /* small promo tile: 440 x 280 */
  [data-size="small"] .tile { width: 440px; height: 280px; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 14px; padding: 20px; }
  [data-size="small"] .icon { width: 128px; height: 128px; }
  [data-size="small"] h1 { font-size: 30px; }
  [data-size="small"] p { font-size: 15px; line-height: 20px; }
  [data-size="small"] .chips { display: none; }

  /* marquee: 1400 x 560 */
  [data-size="marquee"] .tile { width: 1400px; height: 560px; align-items: center; gap: 72px; padding: 0 120px; }
  [data-size="marquee"] .icon { width: 256px; height: 256px; }
  [data-size="marquee"] .copy { display: flex; flex-direction: column; gap: 22px; }
  [data-size="marquee"] h1 { font-size: 84px; }
  [data-size="marquee"] p { font-size: 30px; line-height: 38px; max-width: 760px; }
  [data-size="marquee"] .chip { font-size: 20px; line-height: 28px; padding: 8px 20px; }
</style>
</head>
<body>
<div class="tile">
  <img class="icon" src="webstore-icon.png" alt="">
  <div class="copy">
    <h1>Everything for YouTube</h1>
    <p>Subscriptions tabs and filters, hide Shorts, one-click Watch2Gether</p>
    <div class="chips"><span class="chip">Videos | Shorts tabs</span><span class="chip">Filters</span><span class="chip">Hide Shorts</span><span class="chip">Watch2Gether</span></div>
  </div>
</div>
<script>
  const size = (location.hash || "#small").slice(1);
  document.body.dataset.size = size;
  // the small tile has room for one short line only
  if (size === "small") document.querySelector("p").textContent = "Tabs, filters, hide Shorts and Watch2Gether";
</script>
</body>
</html>
